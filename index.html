<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>我的菜谱</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <main class="page">
    <header class="site-header">
      <h1>我的菜谱</h1>
    </header>
    <section class="cards" aria-label="菜谱卡片">
      <article class="card">
        <h2>番茄炒蛋</h2>
        <ol>
        <li><strong>炒</strong>：鸡蛋大火炒嫩，盛出</li>
        <li><strong>煸</strong>：番茄加盐炒软出汁</li>
        <li><strong>合</strong>：鸡蛋回锅，快速翻匀</li>
        </ol>
      </article>
      <article class="card">
        <h2>红烧排骨</h2>
        <ol>
        <li><strong>煸</strong>：热油炒姜，煎一面排骨，然后放香料</li>
        <li><strong>烹</strong>：烹白酒后小火调味</li>
        <li><strong>炖</strong>：1 小时</li>
        <li><strong>收</strong>：大火收汁，放青椒</li>
        </ol>
      </article>
    </section>
  </main>
</body>
</html>
